version: 2
updates:
  # Actions are pinned to a major tag, which does not move for a new major: without this
  # the workflows silently age into a deprecated runtime.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A major is the only bump worth a pull request here, because the tag in the workflow
    # already resolves to every release below the next one. Proposing an exact minor pin
    # asks to replace a reference that keeps working with one that stops, and it arrives
    # every week for as long as the action is maintained.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for patch and minor bumps: a crawler pulls a wide dependency
      # tree, and one PR per crate would bury the ones that matter.
      minor-and-patch:
        update-types: [minor, patch]
