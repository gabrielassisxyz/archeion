[package]
name = "archeion"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Local-first archival tool for web content and its metadata"
repository = "https://github.com/gabrielassisxyz/archeion"
license = "MIT"
readme = "README.md"
keywords = ["archive", "crawler", "metadata", "local-first"]
categories = ["command-line-utilities"]

[dependencies]
dom_query = "0.28"
dom_smoothie = "0.18"
# Decoding a page's bytes is a separate decision from parsing its markup, so the encoding
# rules live here rather than being delegated to whatever the parser happens to implement.
# That also keeps a page in an encoding the streaming parser refuses outright, UTF-16 among
# them, readable for metadata.
encoding_rs = "0.8.35"
htmd = "0.5"
jiff = { version = "0.2.35", default-features = false, features = ["std", "serde"] }
# A streaming rewriter rather than a DOM, used here only to read. Everything metadata
# extraction looks at is a tag and an attribute, and a page arriving from the open web is
# hostile input whose parse must stay bounded: this one never holds more of the document
# than the token it is on, while a tree would cost the whole page in memory.
lol_html = "2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Spelled out rather than taken as the `basic` bundle, because three of the features in it
# are wrong for an archive and silent about it. `balance` spools a large response body to a
# temporary file and then reports an empty body, which would store the page as if it had
# arrived. `real_browser` attaches a browser fingerprint to every request, which is the
# opposite of a crawler that says who it is. `disk_native_tls` pulls a SQL driver this
# archive has no use for, and with it a crate under an advisory that has no fixed version.
# Removing any entry below changes how the engine crawls, so remove one on purpose.
spider = { version = "2.52.12", default-features = false, features = [
    "adaptive_concurrency",
    "auto_throttle",
    "cookies",
    "dns_cache",
    "encoding",
    "etag_cache",
    "headers",
    "priority_frontier",
    "rate_limit",
    "request_coalesce",
    "reqwest_native_tls_native_roots",
    "string_interner_buffer_backend",
    "sync",
    "time",
    "ua_generator",
    "warc",
] }
thiserror = "2.0.19"
url = "2.5.8"

[profile.release]
# A local-first archiver is IO bound, so the binary is downloaded far more often than it
# is CPU limited: trading a slower build for a smaller artifact is the better deal.
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
