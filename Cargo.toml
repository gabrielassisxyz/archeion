[package]
name = "archeion"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Local-first archival tool for web content and its metadata"
repository = "https://github.com/gabrielassisxyz/archeion"
license = "MIT"
readme = "README.md"
keywords = ["archive", "crawler", "metadata", "local-first"]
categories = ["command-line-utilities"]

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Not the `basic` bundle: it pulls the engine's own SQL-backed spool, and this archive is
# the thing that owns disk. Everything else `basic` turns on is listed here one by one, so
# the engine behaves as it did when it was benchmarked and the dependency tree stays
# something a single operator can audit.
spider = { version = "2.52", default-features = false, features = [
    "adaptive_concurrency",
    "auto_throttle",
    "balance",
    "cookies",
    "dns_cache",
    "encoding",
    "etag_cache",
    "headers",
    "priority_frontier",
    "rate_limit",
    "real_browser",
    "request_coalesce",
    "reqwest_native_tls_native_roots",
    "string_interner_buffer_backend",
    "sync",
    "time",
    "ua_generator",
    "warc",
] }
thiserror = "2.0.19"
url = "2.5.8"

[profile.release]
# A local-first archiver is IO bound, so the binary is downloaded far more often than it
# is CPU limited: trading a slower build for a smaller artifact is the better deal.
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
